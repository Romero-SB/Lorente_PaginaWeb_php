name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    backend:
        name: PHP · Pint · PHPUnit
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.3'
                  extensions: mbstring, pdo, pdo_sqlite, sqlite3, fileinfo, xml, curl
                  coverage: none

            - name: Cache Composer
              uses: actions/cache@v4
              with:
                  path: vendor
                  key: composer-${{ hashFiles('composer.lock') }}
                  restore-keys: composer-

            - name: Install dependencies
              run: composer install --no-interaction --no-progress --prefer-dist

            - name: Pint (estilo de código)
              run: vendor/bin/pint --test

            - name: PHPUnit
              run: vendor/bin/phpunit

    frontend:
        name: Node · Build · Vitest
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build assets
              run: npm run build

            - name: Vitest
              run: npm run test